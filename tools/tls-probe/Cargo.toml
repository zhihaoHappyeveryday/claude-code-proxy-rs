[package]
name = "claude-tls-probe"
version = "0.1.0"
edition = "2024"
publish = false

# 独立实验，不把尚未验证的传输引擎加入网关依赖图。
[workspace]

[dependencies]
futures-util = "0.3.32"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
wreq = { version = "=0.16.1", default-features = false, features = ["tokio-rt", "stream"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = false
