[package]
name = "gateway-provider-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
base64 = "0.23.0"
sha2 = "0.11"
rand_core = { version = "0.6.4", features = ["getrandom"] }
tracing = "0.1.44"
async-stream = "0.3.6"
async-trait = "0.1.89"
chrono = "0.4.45"
bytes = "1.11.1"
futures = "0.3.32"
gateway-admin = { path = "../../gateway-admin" }
gateway-core = { path = "../../gateway-core" }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "socks"] }
wreq = { version = "=0.16.1", default-features = false, features = ["tokio-rt", "stream", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
url = "2.5.8"
tokio = { version = "1.52.3", default-features = false, features = ["time", "sync", "rt"] }
uuid = { version = "1.23.3", features = ["v7"] }

[lints]
workspace = true
